default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV["USER"] %>
  password: ullas123
  host: localhost

development:
  <<: *default
  database: cortex_development

test:
  <<: *default
  database: cortex_test

production:
  <<: *default
  database: cortex_production


